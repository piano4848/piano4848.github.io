<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>probe</title>
<style>body{margin:0;background:#222;color:#eee;font:12px/1.5 monospace}pre{padding:10px;white-space:pre-wrap}iframe{border:0;display:block}</style>
</head><body>
<div id="out"><pre>measuring…</pre></div>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get("w")||"390",10), h = parseInt(q.get("h")||"844",10);
var extra = q.get("clean") ? "?clean=1" : "";
var f = document.getElementById("f");
f.width = w; f.height = h;
f.src = "index.html" + extra;
f.onload = function(){
  setTimeout(function(){
    var d = f.contentDocument, win = f.contentWindow;
    function box(sel){
      var e = d.querySelector(sel); if(!e) return sel+": (none)";
      var r = e.getBoundingClientRect();
      return sel+": top="+Math.round(r.top)+" h="+Math.round(r.height)+" w="+Math.round(r.width)+" bottom="+Math.round(r.bottom);
    }
    var lines = [];
    lines.push("view="+w+"x"+h+" docH="+d.documentElement.scrollHeight+" innerH="+win.innerHeight+" overflow="+(d.documentElement.scrollHeight-win.innerHeight));
    ["header.top",".strip",".layout",".stage",".tray",".print",".plate",".cal",".grid",".side",".controls",".foot"].forEach(function(s){lines.push(box(s));});
    var pr = d.querySelector(".print").getBoundingClientRect();
    lines.push("print aspect="+(pr.width/pr.height).toFixed(3));
    lines.push("fontTest="+win.getComputedStyle(d.querySelector("h1")).fontFamily);
    document.getElementById("out").innerHTML = "<pre>"+lines.join("\n")+"</pre>";
  }, 600);
};
</script>
</body></html>
