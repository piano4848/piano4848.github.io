<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>생각나름 자료실</title>
<meta http-equiv="refresh" content="1; url=./mission4/" />
<style>
  :root {
    --bg: #F6F8F4;
    --card: #FFFFFF;
    --ink: #233028;
    --ink-soft: #3E4F45;
    --sage: #3E5949;
    --sage-line: rgba(62, 89, 73, 0.22);
    --gold: #B98A2E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
      "맑은 고딕", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
  }
  .box {
    background: var(--card);
    border: 1.5px solid var(--sage-line);
    border-radius: 18px;
    padding: 30px 24px 28px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(62, 89, 73, 0.10);
  }
  .kicker {
    display: inline-block;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--gold);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 30px;
    line-height: 1.35;
    font-weight: 900;
    color: var(--sage);
    margin: 0 0 14px;
    word-break: keep-all;
  }
  p {
    font-size: 18px;
    line-height: 1.65;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 22px;
    word-break: keep-all;
  }
  a.btn {
    display: block;
    background: var(--sage);
    color: #FFFFFF;
    text-decoration: none;
    font-size: 20px;
    font-weight: 900;
    padding: 18px 16px;
    border-radius: 14px;
    letter-spacing: -0.2px;
  }
  a.btn:active { opacity: 0.88; }
  .sub {
    margin: 16px 0 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="box">
    <span class="kicker">생각나름 · 생각아트</span>
    <h1>[미션 4] 웹 자료실로 안내합니다</h1>
    <p>잠시 후 자료실이 자동으로 열립니다.<br />바로 열리지 않으면 아래 버튼을 눌러 주세요.</p>
    <a class="btn" href="./mission4/">미션 4 자료실 열기 →</a>
    <p class="sub">이 주소는 만료 없이 계속 열리는 고정 주소입니다.</p>
  </div>
</body>
</html>
